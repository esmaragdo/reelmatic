<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReelMatic.Pro Studio</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        body { font-family: 'Montserrat', sans-serif; background-color: #0b0c10; color: #f1f5f9; overflow-x: hidden; }
        .canvas-container { position: relative; width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 1rem; overflow: hidden; box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.08); }
        canvas { width: 100%; height: 100%; display: block; }
        
        .recording-overlay {
            position: absolute; inset: 0; border: 3px solid #3b82f6; z-index: 50; pointer-events: none;
            display: flex; justify-content: center; align-items: center; background: rgba(0,0,0,0.75); backdrop-filter: blur(8px);
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.15); border-radius: 9999px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.25); }
    </style>
</head>
<body class="bg-[#08090c] text-slate-100 min-h-screen flex flex-col">

    <div id="root" class="flex-1 flex flex-col h-screen"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback } = React;

        const easeOutQuart = x => 1 - Math.pow(1 - x, 4);
        const easeOutExpo = x => x === 1 ? 1 : 1 - Math.pow(2, -10 * x);
        const easeOutBack = x => {
            const c1 = 1.70158;
            const c3 = c1 + 1;
            return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2);
        };
        const elasticOut = x => {
            const c4 = (2 * Math.PI) / 3;
            return x === 0 ? 0 : x === 1 ? 1 : Math.pow(2, -10 * x) * Math.sin((x * 10 - 0.75) * c4) + 1;
        };

        const App = () => {
            // Text inputs
            const [text1, setText1] = useState("2023 Top Ten");
            const [text2, setText2] = useState("de los Destinos Turísticos");
            const [text3, setText3] = useState("en el Mundo.");
            const [logoText, setLogoText] = useState("ReelMatic.Pro");
            const [sourceText, setSourceText] = useState("Fuente: Organización Mundial del Turismo");
            
            // 1. Source alignment
            const [sourceAlign, setSourceAlign] = useState("left"); // "left" | "right"

            // 2. Framed Photo (Polaroid)
            const [useFramedPhoto, setUseFramedPhoto] = useState(false);
            const [framedPhotoImg, setFramedPhotoImg] = useState(null);
            const [photoCaption, setPhotoCaption] = useState("Playa Paraíso, México");

            // 3. Transparent Character
            const [useCharacter, setUseCharacter] = useState(false);
            const [characterImg, setCharacterImg] = useState(null);
            const [charName, setCharName] = useState("Dra. Elena Ruiz");
            const [charRole, setCharRole] = useState("Directora de Turismo Global");

            // 4. Motion Variants (3 styles)
            const [motionStyle, setMotionStyle] = useState("dynamic"); // "classic" | "dynamic" | "spring"

            // 5. Backgrounds & Color Palettes
            const [bgColorChoice, setBgColorChoice] = useState("grey"); // "white" | "black" | "grey"
            const [paletteChoice, setPaletteChoice] = useState("minimal"); // "minimal" | "vibrant" | "neon"

            const [isRecording, setIsRecording] = useState(false);
            const [isPlaying, setIsPlaying] = useState(false);
            const [progress, setProgress] = useState(0);

            const canvasRef = useRef(null);
            const animationRef = useRef(null);
            const mediaRecorderRef = useRef(null);
            const chunksRef = useRef([]);

            // Helper to draw cover image without distortion
            const drawImageCover = (ctx, img, x, y, w, h) => {
                const imgRatio = img.width / img.height;
                const targetRatio = w / h;
                let sWidth = img.width;
                let sHeight = img.height;
                let sX = 0;
                let sY = 0;

                if (imgRatio > targetRatio) {
                    sWidth = img.height * targetRatio;
                    sX = (img.width - sWidth) / 2;
                } else {
                    sHeight = img.width / targetRatio;
                    sY = (img.height - sHeight) / 2;
                }
                ctx.drawImage(img, sX, sY, sWidth, sHeight, x, y, w, h);
            };

            const drawFrame = useCallback((ctx, timeMs, texts, cfg) => {
                const width = 1920;
                const height = 1080;
                
                // --- 5. Background Colors & Palettes ---
                let bgHex = '#e8e8e8'; // Grey default
                if (cfg.bg === 'white') bgHex = '#f8fafc';
                if (cfg.bg === 'black') bgHex = '#0c0d12';

                ctx.fillStyle = bgHex;
                ctx.fillRect(0, 0, width, height);

                // Vignette / Gradient depth
                const gradient = ctx.createRadialGradient(width/2, height/2, height*0.4, width/2, height/2, width*0.8);
                gradient.addColorStop(0, 'rgba(0,0,0,0)');
                gradient.addColorStop(1, cfg.bg === 'black' ? 'rgba(0,0,0,0.6)' : 'rgba(0,0,0,0.25)');
                ctx.fillStyle = gradient;
                ctx.fillRect(0, 0, width, height);

                // Colors based on palettes & bg
                let primaryColor = cfg.bg === 'black' ? '#ffffff' : '#000000';
                let accentColor = primaryColor;
                let boxBgColor = primaryColor;
                let boxTextColor = cfg.bg === 'black' ? '#000000' : '#ffffff';

                if (cfg.palette === 'vibrant') {
                    accentColor = '#3b82f6';
                } else if (cfg.palette === 'neon') {
                    accentColor = '#06b6d4';
                }

                // Animation Timings based on Motion Variant (4)
                let t1, t2, t3, t4, tSource, tLogo;
                if (cfg.motion === 'spring') {
                    t1 = Math.max(0, Math.min(1, timeMs / 700));
                    t2 = Math.max(0, Math.min(1, (timeMs - 400) / 700));
                    t3 = Math.max(0, Math.min(1, (timeMs - 800) / 700));
                    t4 = Math.max(0, Math.min(1, (timeMs - 1200) / 600));
                    tSource = Math.max(0, Math.min(1, (timeMs - 1500) / 600));
                    tLogo = Math.max(0, Math.min(1, (timeMs - 1700) / 600));
                } else if (cfg.motion === 'dynamic') {
                    t1 = Math.max(0, Math.min(1, (timeMs - 200) / 800));
                    t2 = Math.max(0, Math.min(1, (timeMs - 800) / 800));
                    t3 = Math.max(0, Math.min(1, (timeMs - 1400) / 800));
                    t4 = Math.max(0, Math.min(1, (timeMs - 1900) / 700));
                    tSource = Math.max(0, Math.min(1, (timeMs - 2200) / 800));
                    tLogo = Math.max(0, Math.min(1, (timeMs - 2500) / 800));
                } else {
                    // Classic
                    t1 = Math.max(0, Math.min(1, (timeMs - 400) / 1000));
                    t2 = Math.max(0, Math.min(1, (timeMs - 1100) / 1000));
                    t3 = Math.max(0, Math.min(1, (timeMs - 1800) / 1000));
                    t4 = Math.max(0, Math.min(1, (timeMs - 2300) / 900));
                    tSource = Math.max(0, Math.min(1, (timeMs - 2700) / 1000));
                    tLogo = Math.max(0, Math.min(1, (timeMs - 3000) / 1000));
                }

                // Layout Positioning: If framed photo or character is active, shift main text to the right (2 & 3)
                const hasVisualLeft = cfg.useFramed || cfg.useChar;
                const startX = hasVisualLeft ? width * 0.46 : width * 0.25;
                const startY = height * 0.35;

                // --- 2. FRAMED PHOTO (POLAROID) ---
                if (cfg.useFramed) {
                    const animProgress = cfg.motion === 'spring' ? elasticOut(t1) : easeOutExpo(t1);
                    const slideX = (1 - animProgress) * -500;
                    const tiltAngle = -4 * (Math.PI / 180); // -4 degrees tilt

                    ctx.save();
                    ctx.translate(180 + slideX, 220);
                    ctx.rotate(tiltAngle);

                    // Polaroid container shadow & white frame
                    ctx.shadowColor = 'rgba(0,0,0,0.35)';
                    ctx.shadowBlur = 40;
                    ctx.shadowOffsetX = 10;
                    ctx.shadowOffsetY = 20;
                    ctx.fillStyle = cfg.bg === 'black' ? '#1e2028' : '#ffffff';
                    ctx.fillRect(0, 0, 520, 640);

                    // Photo Image inside frame
                    ctx.shadowColor = 'transparent';
                    ctx.beginPath();
                    ctx.rect(35, 35, 450, 480);
                    ctx.clip();

                    if (cfg.framedImgObj) {
                        drawImageCover(ctx, cfg.framedImgObj, 35, 35, 450, 480);
                    } else {
                        ctx.fillStyle = '#cbd5e1';
                        ctx.fillRect(35, 35, 450, 480);
                        ctx.fillStyle = '#475569';
                        ctx.font = '600 24px Montserrat';
                        ctx.fillText("Sin Imagen", 185, 275);
                    }
                    ctx.restore();

                    // Parallel Rotated Caption (Mini pie de foto inclinado en paralelo)
                    if (texts.photoCaption) {
                        ctx.save();
                        ctx.translate(180 + slideX, 220);
                        ctx.rotate(tiltAngle);
                        ctx.font = '500 22px Montserrat';
                        ctx.fillStyle = primaryColor;
                        ctx.textBaseline = 'top';
                        ctx.textAlign = 'center';
                        ctx.fillText(texts.photoCaption, 260, 560);
                        ctx.restore();
                    }
                }

                // --- 3. TRANSPARENT CHARACTER (Elevated to avoid footer/source collision) ---
                if (cfg.useChar) {
                    const animProgress = cfg.motion === 'spring' ? elasticOut(t1) : easeOutExpo(t1);
                    const slideX = (1 - animProgress) * -400;

                    ctx.save();
                    ctx.translate(120 + slideX, 0);

                    // Elevated vertical positioning (y = 120 instead of bottom)
                    const charW = 460;
                    const charH = 680;
                    const charX = 80;
                    const charY = 120;

                    if (cfg.charImgObj) {
                        ctx.save();
                        ctx.beginPath();
                        ctx.roundRect(charX, charY, charW, charH, 24);
                        ctx.clip();
                        drawImageCover(ctx, cfg.charImgObj, charX, charY, charW, charH);
                        ctx.restore();
                    } else {
                        ctx.fillStyle = '#334155';
                        ctx.beginPath();
                        ctx.roundRect(charX, charY, charW, charH, 24);
                        ctx.fill();
                        ctx.fillStyle = '#ffffff';
                        ctx.font = '600 22px Montserrat';
                        ctx.fillText("Personaje Transparente", charX + 90, charY + 340);
                    }

                    // Name & Role Badge (Floating card at bottom of character cutout)
                    if (texts.charName) {
                        const cardX = charX + 40;
                        const cardY = charY + charH - 130;
                        const cardW = charW - 80;
                        const cardH = 95;

                        ctx.shadowColor = 'rgba(0,0,0,0.3)';
                        ctx.shadowBlur = 20;
                        ctx.shadowOffsetY = 10;
                        ctx.fillStyle = 'rgba(15, 23, 42, 0.9)';
                        ctx.beginPath();
                        ctx.roundRect(cardX, cardY, cardW, cardH, 16);
                        ctx.fill();

                        ctx.shadowColor = 'transparent';
                        ctx.fillStyle = '#ffffff';
                        ctx.font = '700 24px Montserrat';
                        ctx.textBaseline = 'top';
                        ctx.fillText(texts.charName, cardX + 24, cardY + 20);

                        ctx.fillStyle = '#60a5fa';
                        ctx.font = '600 16px Montserrat';
                        ctx.fillText(texts.charRole || '', cardX + 24, cardY + 54);
                    }
                    ctx.restore();
                }

                // --- LINEA 1 ---
                if (t1 > 0) {
                    ctx.save();
                    const animP = cfg.motion === 'spring' ? elasticOut(t1) : easeOutExpo(t1);
                    ctx.font = '800 100px Montserrat';
                    const textMetrics = ctx.measureText(texts.t1);
                    const padX = 35;
                    const padY = 25;
                    const boxW = textMetrics.width + (padX * 2);
                    const boxH = 130;

                    ctx.beginPath();
                    ctx.rect(startX, startY, boxW, boxH);
                    ctx.clip();

                    const slideOffset = (1 - animP) * boxW;
                    
                    ctx.fillStyle = boxBoxColor(boxBgColor, accentColor);
                    ctx.fillRect(startX - slideOffset, startY, boxW, boxH);
                    
                    ctx.fillStyle = boxTextColor;
                    ctx.textBaseline = 'top';
                    ctx.fillText(texts.t1, startX + padX - slideOffset, startY + padY);
                    ctx.restore();
                }

                function boxBoxColor(def, acc) {
                    return cfg.palette !== 'minimal' ? acc : def;
                }

                // --- LINEA 2 ---
                if (t2 > 0) {
                    ctx.save();
                    const easeVal = cfg.motion === 'spring' ? elasticOut(t2) : easeOutExpo(t2);
                    ctx.globalAlpha = easeVal;
                    ctx.font = '300 80px Montserrat';
                    
                    const yOffset = (1 - easeVal) * 50;
                    const line2X = startX + 20;
                    const line2Y = startY + 160 + yOffset;

                    ctx.fillStyle = primaryColor;
                    ctx.textBaseline = 'top';
                    ctx.fillText(texts.t2, line2X, line2Y);
                    ctx.restore();
                }

                // --- LINEA 3 ---
                if (t3 > 0) {
                    ctx.save();
                    const easeVal = cfg.motion === 'spring' ? elasticOut(t3) : easeOutExpo(t3);
                    ctx.globalAlpha = easeVal;
                    ctx.font = '800 110px Montserrat';
                    
                    const textMetrics = ctx.measureText(texts.t3);
                    const line3X = startX + 150;
                    const line3Y = startY + 280;

                    const yOffset = (1 - easeVal) * 30;

                    ctx.fillStyle = primaryColor;
                    ctx.textBaseline = 'top';
                    ctx.fillText(texts.t3, line3X, line3Y + yOffset);

                    if (t4 > 0) {
                        const lineW = textMetrics.width * (cfg.motion === 'spring' ? elasticOut(t4) : easeOutExpo(t4));
                        ctx.fillStyle = accentColor;
                        ctx.fillRect(line3X, line3Y + yOffset + 130, lineW, 8);
                    }

                    ctx.restore();
                }

                // --- 1. FUENTE (Alineación izquierda o derecha configurable) ---
                if (tSource > 0 && texts.source) {
                    ctx.save();
                    const easeVal = easeOutQuart(tSource);
                    ctx.globalAlpha = easeVal * 0.75;
                    ctx.font = '500 26px Montserrat';
                    ctx.fillStyle = primaryColor;
                    ctx.textBaseline = 'bottom';
                    
                    const textM = ctx.measureText(texts.source);
                    let sourceX = 80;
                    if (cfg.sourceAlign === 'right') {
                        sourceX = width - textM.width - 80;
                    }

                    const xOffset = (1 - easeVal) * (cfg.sourceAlign === 'right' ? 20 : -20);
                    ctx.fillText(texts.source, sourceX + xOffset, height - 60);
                    ctx.restore();
                }

                // --- LOGO ---
                if (tLogo > 0) {
                    ctx.save();
                    const easeVal = easeOutBack(tLogo);
                    ctx.globalAlpha = Math.min(1, tLogo * 2);
                    ctx.font = '700 30px Montserrat';
                    const logoMetrics = ctx.measureText(texts.logo);
                    const padX = 20;
                    const padY = 15;
                    const boxW = logoMetrics.width + (padX * 2);
                    const boxH = 60;
                    
                    const logoX = width - boxW - 80;
                    const logoY = 80;
                    const yOffset = (1 - easeVal) * -40;
                    
                    ctx.fillStyle = primaryColor;
                    ctx.fillRect(logoX, logoY + yOffset, boxW, boxH);
                    
                    ctx.fillStyle = boxTextColor;
                    ctx.textBaseline = 'top';
                    ctx.fillText(texts.logo, logoX + padX, logoY + padY + yOffset);
                    ctx.restore();
                }

            }, []);

            const playAnimation = useCallback((record = false) => {
                if (isPlaying) return;
                
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                const startTime = performance.now();
                const duration = 5000;
                
                const currentTexts = { t1: text1, t2: text2, t3: text3, logo: logoText, source: sourceText, photoCaption, charName, charRole };
                const currentCfg = {
                    useFramed: useFramedPhoto,
                    framedImgObj: framedPhotoImg,
                    useChar: useCharacter,
                    charImgObj: characterImg,
                    sourceAlign: sourceAlign,
                    motion: motionStyle,
                    bg: bgColorChoice,
                    palette: paletteChoice
                };

                setIsPlaying(true);
                if (record) {
                    setIsRecording(true);
                    setProgress(0);
                    chunksRef.current = [];
                    const stream = canvas.captureStream(60); 
                    
                    let mimeType = 'video/webm; codecs=vp9';
                    if (!MediaRecorder.isTypeSupported(mimeType)) {
                        mimeType = 'video/webm';
                    }

                    try {
                        mediaRecorderRef.current = new MediaRecorder(stream, { mimeType });
                    } catch (e) {
                        mediaRecorderRef.current = new MediaRecorder(stream);
                    }
                    
                    mediaRecorderRef.current.ondataavailable = e => {
                        if (e.data.size > 0) chunksRef.current.push(e.data);
                    };
                    
                    mediaRecorderRef.current.onstop = () => {
                        const blob = new Blob(chunksRef.current, { type: 'video/webm' });
                        const url = URL.createObjectURL(blob);
                        const a = document.createElement('a');
                        a.href = url;
                        a.download = `ReelMatic_${Date.now()}.webm`;
                        a.click();
                        URL.revokeObjectURL(url);
                        setIsRecording(false);
                        setProgress(0);
                    };
                    
                    mediaRecorderRef.current.start();
                }

                const animate = (currentTime) => {
                    const elapsed = currentTime - startTime;
                    drawFrame(ctx, elapsed, currentTexts, currentCfg);
                    
                    if (record) {
                        setProgress(Math.min(100, (elapsed / duration) * 100));
                    }

                    if (elapsed < duration) {
                        animationRef.current = requestAnimationFrame(animate);
                    } else {
                        setIsPlaying(false);
                        if (record && mediaRecorderRef.current && mediaRecorderRef.current.state !== 'inactive') {
                            mediaRecorderRef.current.stop();
                        }
                    }
                };
                
                animationRef.current = requestAnimationFrame(animate);
            }, [drawFrame, isPlaying, text1, text2, text3, logoText, sourceText, photoCaption, charName, charRole, useFramedPhoto, framedPhotoImg, useCharacter, characterImg, sourceAlign, motionStyle, bgColorChoice, paletteChoice]);

            // File upload handlers
            const handleFramedPhotoUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (event) => {
                    const img = new Image();
                    img.onload = () => setFramedPhotoImg(img);
                    img.src = event.target.result;
                };
                reader.readAsDataURL(file);
            };

            const handleCharacterUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (event) => {
                    const img = new Image();
                    img.onload = () => setCharacterImg(img);
                    img.src = event.target.result;
                };
                reader.readAsDataURL(file);
            };

            useEffect(() => {
                return () => {
                    if (animationRef.current) cancelAnimationFrame(animationRef.current);
                };
            }, []);

            useEffect(() => {
                document.fonts.ready.then(() => {
                    const canvas = canvasRef.current;
                    if (!canvas) return;
                    const ctx = canvas.getContext('2d');
                    drawFrame(ctx, 5000, { t1: text1, t2: text2, t3: text3, logo: logoText, source: sourceText, photoCaption, charName, charRole }, {
                        useFramed: useFramedPhoto, framedImgObj: framedPhotoImg, useChar: useCharacter, charImgObj: characterImg, sourceAlign: sourceAlign, motion: motionStyle, bg: bgColorChoice, palette: paletteChoice
                    });
                });
            }, [text1, text2, text3, logoText, sourceText, photoCaption, charName, charRole, useFramedPhoto, framedPhotoImg, useCharacter, characterImg, sourceAlign, motionStyle, bgColorChoice, paletteChoice, drawFrame]);

            return (
                <div className="flex-1 flex flex-col h-screen overflow-hidden">
                    {/* Header (6. ReelMatic.Pro branding) */}
                    <header className="h-16 bg-[#0d0e12] border-b border-white/10 px-6 flex items-center justify-between shrink-0 z-30">
                        <div className="flex items-center gap-3">
                            <div className="w-9 h-9 rounded-xl bg-gradient-to-tr from-blue-600 via-indigo-500 to-cyan-400 p-[1px] shadow-lg shadow-blue-500/20 flex items-center justify-center">
                                <div className="w-full h-full bg-[#0a0b0e] rounded-[11px] flex items-center justify-center font-bold text-xs tracking-tighter text-white">
                                    RM
                                </div>
                            </div>
                            <h1 className="text-lg font-bold tracking-tight text-white">
                                ReelMatic.Pro
                            </h1>
                        </div>
                        <div className="text-xs text-slate-400 font-medium bg-white/5 border border-white/10 px-3 py-1.5 rounded-full">
                            Studio Motion Engine v3.5
                        </div>
                    </header>

                    <div className="flex-1 flex flex-col lg:flex-row overflow-hidden">
                        {/* Apple-grade Sidebar Controls */}
                        <div className="w-full lg:w-[440px] bg-[#0d0e12]/95 backdrop-blur-2xl border-r border-white/10 p-6 flex flex-col justify-between z-20 shrink-0 overflow-y-auto">
                            <div className="space-y-6">
                                <div>
                                    <h2 className="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-4">Textos Principales</h2>
                                    <div className="space-y-3">
                                        <div className="space-y-1">
                                            <label className="text-[11px] font-medium text-slate-400">Línea 1 (Bloque Negro)</label>
                                            <input type="text" value={text1} onChange={e => setText1(e.target.value)} disabled={isRecording}
                                                className="w-full bg-[#13151c] border border-white/10 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-blue-500" />
                                        </div>
                                        <div className="space-y-1">
                                            <label className="text-[11px] font-medium text-slate-400">Línea 2 (Subtítulo)</label>
                                            <input type="text" value={text2} onChange={e => setText2(e.target.value)} disabled={isRecording}
                                                className="w-full bg-[#13151c] border border-white/10 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-blue-500" />
                                        </div>
                                        <div className="space-y-1">
                                            <label className="text-[11px] font-medium text-slate-400">Línea 3 (Destacado)</label>
                                            <input type="text" value={text3} onChange={e => setText3(e.target.value)} disabled={isRecording}
                                                className="w-full bg-[#13151c] border border-white/10 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-blue-500" />
                                        </div>
                                    </div>
                                </div>

                                <div className="pt-4 border-t border-white/10 space-y-3">
                                    <h2 className="text-xs font-semibold text-slate-400 uppercase tracking-wider">Detalles & Créditos</h2>
                                    <div className="space-y-1">
                                        <label className="text-[11px] font-medium text-slate-400">Texto del Logo</label>
                                        <input type="text" value={logoText} onChange={e => setLogoText(e.target.value)} disabled={isRecording}
                                            className="w-full bg-[#13151c] border border-white/10 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-blue-500" />
                                    </div>
                                    <div className="space-y-1">
                                        <label className="text-[11px] font-medium text-slate-400">Texto de la Fuente</label>
                                        <input type="text" value={sourceText} onChange={e => setSourceText(e.target.value)} disabled={isRecording}
                                            className="w-full bg-[#13151c] border border-white/10 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-blue-500" />
                                    </div>
                                    {/* 1. Fuente a la izquierda o derecha */}
                                    <div className="space-y-1">
                                        <label className="text-[11px] font-medium text-slate-400">Alineación de la Fuente</label>
                                        <select value={sourceAlign} onChange={e => setSourceAlign(e.target.value)}
                                            className="w-full bg-[#13151c] border border-white/10 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-blue-500">
                                            <option value="left">Izquierda</option>
                                            <option value="right">Derecha</option>
                                        </select>
                                    </div>
                                </div>

                                <div className="pt-4 border-t border-white/10 space-y-4">
                                    <h2 className="text-xs font-semibold text-slate-400 uppercase tracking-wider">Elementos Visuales (Izquierda)</h2>
                                    
                                    {/* 2. Framed Photo Control */}
                                    <div className="bg-[#13151c] p-4 rounded-xl border border-white/10 space-y-3">
                                        <div className="flex items-center justify-between">
                                            <span className="text-xs font-bold text-white">Foto con Marco (Polaroid)</span>
                                            <input type="checkbox" checked={useFramedPhoto} onChange={e => { setUseFramedPhoto(e.target.checked); if(e.target.checked) setUseCharacter(false); }}
                                                className="w-4 h-4 rounded accent-blue-500 cursor-pointer" />
                                        </div>
                                        {useFramedPhoto && (
                                            <div className="space-y-2 pt-2 border-t border-white/10">
                                                <input type="file" accept="image/*" onChange={handleFramedPhotoUpload} className="w-full text-xs text-slate-400 file:mr-3 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-blue-600 file:text-white hover:file:bg-blue-500 cursor-pointer" />
                                                <input type="text" placeholder="Pie de foto (ej. Playa Paraíso)" value={photoCaption} onChange={e => setPhotoCaption(e.target.value)}
                                                    className="w-full bg-[#0a0b0e] border border-white/10 rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-blue-500" />
                                            </div>
                                        )}
                                    </div>

                                    {/* 3. Transparent Character Control */}
                                    <div className="bg-[#13151c] p-4 rounded-xl border border-white/10 space-y-3">
                                        <div className="flex items-center justify-between">
                                            <span className="text-xs font-bold text-white">Personaje Transparente</span>
                                            <input type="checkbox" checked={useCharacter} onChange={e => { setUseCharacter(e.target.checked); if(e.target.checked) setUseFramedPhoto(false); }}
                                                className="w-4 h-4 rounded accent-blue-500 cursor-pointer" />
                                        </div>
                                        {useCharacter && (
                                            <div className="space-y-2 pt-2 border-t border-white/10">
                                                <input type="file" accept="image/*" onChange={handleCharacterUpload} className="w-full text-xs text-slate-400 file:mr-3 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-blue-600 file:text-white hover:file:bg-blue-500 cursor-pointer" />
                                                <input type="text" placeholder="Nombre del personaje" value={charName} onChange={e => setCharName(e.target.value)}
                                                    className="w-full bg-[#0a0b0e] border border-white/10 rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-blue-500" />
                                                <input type="text" placeholder="Cargo o Puesto" value={charRole} onChange={e => setCharRole(e.target.value)}
                                                    className="w-full bg-[#0a0b0e] border border-white/10 rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-blue-500" />
                                            </div>
                                        )}
                                    </div>
                                </div>

                                <div className="pt-4 border-t border-white/10 grid grid-cols-3 gap-3">
                                    {/* 4. Motion Variants */}
                                    <div className="space-y-1">
                                        <label className="text-[10px] font-semibold text-slate-400 uppercase">Movimiento</label>
                                        <select value={motionStyle} onChange={e => setMotionStyle(e.target.value)}
                                            className="w-full bg-[#13151c] border border-white/10 rounded-xl px-2.5 py-2 text-xs text-white focus:outline-none focus:border-blue-500">
                                            <option value="classic">Clásico</option>
                                            <option value="dynamic">Dinámico</option>
                                            <option value="spring">Spring</option>
                                        </select>
                                    </div>
                                    {/* 5. Background Color */}
                                    <div className="space-y-1">
                                        <label className="text-[10px] font-semibold text-slate-400 uppercase">Fondo</label>
                                        <select value={bgColorChoice} onChange={e => setBgColorChoice(e.target.value)}
                                            className="w-full bg-[#13151c] border border-white/10 rounded-xl px-2.5 py-2 text-xs text-white focus:outline-none focus:border-blue-500">
                                            <option value="grey">Gris</option>
                                            <option value="white">Blanco</option>
                                            <option value="black">Negro</option>
                                        </select>
                                    </div>
                                    {/* 5. Color Palettes */}
                                    <div className="space-y-1">
                                        <label className="text-[10px] font-semibold text-slate-400 uppercase">Paleta</label>
                                        <select value={paletteChoice} onChange={e => setPaletteChoice(e.target.value)}
                                            className="w-full bg-[#13151c] border border-white/10 rounded-xl px-2.5 py-2 text-xs text-white focus:outline-none focus:border-blue-500">
                                            <option value="minimal">Monocromo</option>
                                            <option value="vibrant">Azul Pro</option>
                                            <option value="neon">Neón Cyan</option>
                                        </select>
                                    </div>
                                </div>
                            </div>

                            <div className="mt-8 space-y-3 pt-4 border-t border-white/10 shrink-0">
                                <button onClick={() => playAnimation(false)} disabled={isPlaying}
                                    className={`w-full py-3 rounded-xl font-semibold text-sm transition-all flex justify-center items-center gap-2 border ${isPlaying ? 'bg-white/5 border-white/5 text-slate-500 cursor-not-allowed' : 'bg-white/10 hover:bg-white/15 border-white/15 text-white shadow-lg'}`}>
                                    Previsualizar Animación
                                </button>
                                <button onClick={() => playAnimation(true)} disabled={isRecording || isPlaying}
                                    className={`w-full py-3.5 rounded-xl font-bold text-sm transition-all flex justify-center items-center gap-2 shadow-xl ${isRecording || isPlaying ? 'bg-blue-600/50 text-slate-300 cursor-not-allowed' : 'bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white shadow-blue-500/25'}`}>
                                    <div className={`w-3 h-3 rounded-full bg-white ${isRecording ? 'animate-ping' : 'animate-pulse'}`}></div>
                                    {isRecording ? 'Renderizando Video...' : 'Exportar a WebM (.webm)'}
                                </button>
                            </div>
                        </div>

                        {/* Main Preview Canvas Area */}
                        <div className="flex-1 p-6 lg:p-12 flex flex-col items-center justify-center bg-[#050608] relative overflow-hidden">
                            <div className="absolute w-[600px] h-[600px] bg-blue-600/10 rounded-full blur-[140px] pointer-events-none"></div>

                            <div className="w-full max-w-5xl relative z-10 flex flex-col items-center">
                                <div className="canvas-container">
                                    <canvas ref={canvasRef} width="1920" height="1080"></canvas>
                                    
                                    {isRecording && (
                                        <div className="recording-overlay flex-col gap-4">
                                            <div className="text-white font-bold text-xl flex items-center gap-3">
                                                <div className="w-4 h-4 bg-blue-500 rounded-full animate-ping"></div>
                                                Renderizando Frame a Frame (60 FPS)
                                            </div>
                                            <div className="w-72 bg-white/10 h-2 rounded-full overflow-hidden p-0.5 border border-white/10">
                                                <div className="h-full bg-gradient-to-r from-blue-500 to-cyan-400 rounded-full transition-all duration-75" style={{ width: `${progress}%` }}></div>
                                            </div>
                                            <span className="text-xs font-mono text-blue-400 font-bold">{Math.round(progress)}% Completo</span>
                                        </div>
                                    )}
                                </div>
                                <div className="mt-4 flex items-center justify-between w-full text-xs text-slate-400 px-2 font-medium">
                                    <div className="flex items-center gap-2">
                                        <span className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                                        <span>Motor Canvas HD Activo</span>
                                    </div>
                                    <div className="bg-white/5 border border-white/10 px-3 py-1 rounded-full text-slate-300">
                                        Resolución: 1920x1080 • Formato WebM VP9
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
