<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReelMatic.Pro Studio</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        body { font-family: 'Montserrat', sans-serif; background-color: #0b0c10; color: #f1f5f9; overflow-x: hidden; }
        .canvas-container { position: relative; width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 1rem; overflow: hidden; box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.08); }
        canvas { width: 100%; height: 100%; display: block; }
        
        .recording-overlay {
            position: absolute; inset: 0; border: 3px solid #3b82f6; z-index: 50; pointer-events: none;
            display: flex; justify-content: center; align-items: center; background: rgba(0,0,0,0.75); backdrop-filter: blur(8px);
        }

        /* Custom Apple-like scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.15); border-radius: 9999px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.25); }
    </style>
</head>
<body class="bg-[#08090c] text-slate-100 min-h-screen flex flex-col">

    <div id="root" class="flex-1 flex flex-col h-screen"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback } = React;

        const easeOutQuart = x => 1 - Math.pow(1 - x, 4);
        const easeOutExpo = x => x === 1 ? 1 : 1 - Math.pow(2, -10 * x);
        const easeOutBack = x => {
            const c1 = 1.70158;
            const c3 = c1 + 1;
            return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2);
        };

        const App = () => {
            const [text1, setText1] = useState("2023 Top Ten");
            const [text2, setText2] = useState("de los Destinos Turísticos");
            const [text3, setText3] = useState("en el Mundo.");
            const [logoText, setLogoText] = useState("reelmatic.pro");
            const [sourceText, setSourceText] = useState("Fuente: Organización Mundial del Turismo");
            
            const [isRecording, setIsRecording] = useState(false);
            const [isPlaying, setIsPlaying] = useState(false);
            const [progress, setProgress] = useState(0);

            const canvasRef = useRef(null);
            const animationRef = useRef(null);
            const mediaRecorderRef = useRef(null);
            const chunksRef = useRef([]);

            const drawFrame = useCallback((ctx, timeMs, texts) => {
                const width = 1920;
                const height = 1080;
                
                ctx.fillStyle = '#e8e8e8';
                ctx.fillRect(0, 0, width, height);

                const gradient = ctx.createRadialGradient(width/2, height/2, height*0.4, width/2, height/2, width*0.8);
                gradient.addColorStop(0, 'rgba(0,0,0,0)');
                gradient.addColorStop(1, 'rgba(0,0,0,0.4)');
                ctx.fillStyle = gradient;
                ctx.fillRect(0, 0, width, height);

                const t1 = Math.max(0, Math.min(1, (timeMs - 400) / 1000));
                const t2 = Math.max(0, Math.min(1, (timeMs - 1100) / 1000));
                const t3 = Math.max(0, Math.min(1, (timeMs - 1800) / 1000));
                const t4 = Math.max(0, Math.min(1, (timeMs - 2300) / 900));
                const tSource = Math.max(0, Math.min(1, (timeMs - 2700) / 1000));
                const tLogo = Math.max(0, Math.min(1, (timeMs - 3000) / 1000));

                const startX = width * 0.25;
                const startY = height * 0.35;

                // --- LINEA 1 ---
                if (t1 > 0) {
                    ctx.save();
                    ctx.font = '800 100px Montserrat';
                    const textMetrics = ctx.measureText(texts.t1);
                    const padX = 35;
                    const padY = 25;
                    const boxW = textMetrics.width + (padX * 2);
                    const boxH = 130;

                    ctx.beginPath();
                    ctx.rect(startX, startY, boxW, boxH);
                    ctx.clip();

                    const slideOffset = (1 - easeOutExpo(t1)) * boxW;
                    
                    ctx.fillStyle = '#000000';
                    ctx.fillRect(startX - slideOffset, startY, boxW, boxH);
                    
                    ctx.fillStyle = '#ffffff';
                    ctx.textBaseline = 'top';
                    ctx.fillText(texts.t1, startX + padX - slideOffset, startY + padY);
                    ctx.restore();
                }

                // --- LINEA 2 ---
                if (t2 > 0) {
                    ctx.save();
                    const easeVal = easeOutExpo(t2);
                    ctx.globalAlpha = easeVal;
                    ctx.font = '300 80px Montserrat';
                    
                    const yOffset = (1 - easeVal) * 50;
                    const line2X = startX + 20;
                    const line2Y = startY + 160 + yOffset;

                    ctx.fillStyle = '#000000';
                    ctx.textBaseline = 'top';
                    ctx.fillText(texts.t2, line2X, line2Y);
                    ctx.restore();
                }

                // --- LINEA 3 ---
                if (t3 > 0) {
                    ctx.save();
                    const easeVal = easeOutExpo(t3);
                    ctx.globalAlpha = easeVal;
                    ctx.font = '800 110px Montserrat';
                    
                    const textMetrics = ctx.measureText(texts.t3);
                    const line3X = startX + 150;
                    const line3Y = startY + 280;

                    const yOffset = (1 - easeVal) * 30;

                    ctx.fillStyle = '#000000';
                    ctx.textBaseline = 'top';
                    ctx.fillText(texts.t3, line3X, line3Y + yOffset);

                    if (t4 > 0) {
                        const lineW = textMetrics.width * easeOutExpo(t4);
                        ctx.fillStyle = '#000000';
                        ctx.fillRect(line3X, line3Y + yOffset + 130, lineW, 8);
                    }

                    ctx.restore();
                }

                // --- FUENTE ---
                if (tSource > 0) {
                    ctx.save();
                    ctx.globalAlpha = easeOutQuart(tSource) * 0.6;
                    ctx.font = '500 28px Montserrat';
                    ctx.fillStyle = '#000000';
                    ctx.textBaseline = 'bottom';
                    
                    const xOffset = (1 - easeOutQuart(tSource)) * -20;
                    ctx.fillText(texts.source, 80 + xOffset, height - 60);
                    ctx.restore();
                }

                // --- LOGO ---
                if (tLogo > 0) {
                    ctx.save();
                    const easeVal = easeOutBack(tLogo);
                    ctx.globalAlpha = Math.min(1, tLogo * 2);
                    ctx.font = '700 30px Montserrat';
                    const logoMetrics = ctx.measureText(texts.logo);
                    const padX = 20;
                    const padY = 15;
                    const boxW = logoMetrics.width + (padX * 2);
                    const boxH = 60;
                    
                    const logoX = width - boxW - 80;
                    const logoY = 80;
                    
                    const yOffset = (1 - easeVal) * -40;
                    
                    ctx.fillStyle = '#000000';
                    ctx.fillRect(logoX, logoY + yOffset, boxW, boxH);
                    
                    ctx.fillStyle = '#ffffff';
                    ctx.textBaseline = 'top';
                    ctx.fillText(texts.logo, logoX + padX, logoY + padY + yOffset);
                    ctx.restore();
                }

            }, []);

            const playAnimation = useCallback((record = false) => {
                if (isPlaying) return;
                
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                const startTime = performance.now();
                const duration = 5000;
                
                const currentTexts = { t1: text1, t2: text2, t3: text3, logo: logoText, source: sourceText };

                setIsPlaying(true);
                if (record) {
                    setIsRecording(true);
                    setProgress(0);
                    chunksRef.current = [];
                    const stream = canvas.captureStream(60); 
                    
                    let mimeType = 'video/webm; codecs=vp9';
                    if (!MediaRecorder.isTypeSupported(mimeType)) {
                        mimeType = 'video/webm';
                    }

                    try {
                        mediaRecorderRef.current = new MediaRecorder(stream, { mimeType });
                    } catch (e) {
                        mediaRecorderRef.current = new MediaRecorder(stream);
                    }
                    
                    mediaRecorderRef.current.ondataavailable = e => {
                        if (e.data.size > 0) chunksRef.current.push(e.data);
                    };
                    
                    mediaRecorderRef.current.onstop = () => {
                        const blob = new Blob(chunksRef.current, { type: 'video/webm' });
                        const url = URL.createObjectURL(blob);
                        const a = document.createElement('a');
                        a.href = url;
                        a.download = `ReelMatic_${Date.now()}.webm`;
                        a.click();
                        URL.revokeObjectURL(url);
                        setIsRecording(false);
                        setProgress(0);
                    };
                    
                    mediaRecorderRef.current.start();
                }

                const animate = (currentTime) => {
                    const elapsed = currentTime - startTime;
                    drawFrame(ctx, elapsed, currentTexts);
                    
                    if (record) {
                        setProgress(Math.min(100, (elapsed / duration) * 100));
                    }

                    if (elapsed < duration) {
                        animationRef.current = requestAnimationFrame(animate);
                    } else {
                        setIsPlaying(false);
                        if (record && mediaRecorderRef.current && mediaRecorderRef.current.state !== 'inactive') {
                            mediaRecorderRef.current.stop();
                        }
                    }
                };
                
                animationRef.current = requestAnimationFrame(animate);
            }, [drawFrame, isPlaying, text1, text2, text3, logoText, sourceText]);

            useEffect(() => {
                return () => {
                    if (animationRef.current) cancelAnimationFrame(animationRef.current);
                };
            }, []);

            useEffect(() => {
                document.fonts.ready.then(() => {
                    const canvas = canvasRef.current;
                    if (!canvas) return;
                    const ctx = canvas.getContext('2d');
                    drawFrame(ctx, 5000, { t1: text1, t2: text2, t3: text3, logo: logoText, source: sourceText });
                });
            }, [text1, text2, text3, logoText, sourceText, drawFrame]);

            return (
                <div className="flex-1 flex flex-col lg:flex-row h-full overflow-hidden">
                    {/* Apple-grade Sidebar */}
                    <div className="w-full lg:w-[420px] bg-[#0d0e12]/90 backdrop-blur-2xl border-r border-white/10 p-6 lg:p-8 flex flex-col justify-between z-20 shrink-0 shadow-2xl">
                        <div>
                            <div className="flex items-center gap-3 mb-8">
                                <div className="w-9 h-9 rounded-xl bg-gradient-to-tr from-blue-600 via-indigo-500 to-cyan-400 p-[1px] shadow-lg shadow-blue-500/20 flex items-center justify-center">
                                    <div className="w-full h-full bg-[#0a0b0e] rounded-[11px] flex items-center justify-center font-bold text-xs tracking-tighter text-white">
                                        RM
                                    </div>
                                </div>
                                <div>
                                    <h1 className="text-lg font-semibold tracking-tight text-white flex items-center gap-2">
                                        ReelMatic<span className="text-blue-500 font-bold">.Pro</span>
                                    </h1>
                                    <span className="text-[10px] uppercase tracking-widest text-slate-400 font-medium">Studio Edition</span>
                                </div>
                            </div>

                            <div className="space-y-4">
                                <div className="space-y-1.5">
                                    <label className="text-[11px] font-semibold text-slate-400 uppercase tracking-wider">Línea 1 (Bloque Negro)</label>
                                    <input 
                                        type="text" 
                                        value={text1} 
                                        onChange={e => setText1(e.target.value)} 
                                        disabled={isRecording}
                                        className="w-full bg-[#13151c] border border-white/10 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 transition-all font-medium shadow-inner" 
                                    />
                                </div>
                                <div className="space-y-1.5">
                                    <label className="text-[11px] font-semibold text-slate-400 uppercase tracking-wider">Línea 2 (Subtítulo)</label>
                                    <input 
                                        type="text" 
                                        value={text2} 
                                        onChange={e => setText2(e.target.value)} 
                                        disabled={isRecording}
                                        className="w-full bg-[#13151c] border border-white/10 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 transition-all font-medium shadow-inner" 
                                    />
                                </div>
                                <div className="space-y-1.5">
                                    <label className="text-[11px] font-semibold text-slate-400 uppercase tracking-wider">Línea 3 (Destacado)</label>
                                    <input 
                                        type="text" 
                                        value={text3} 
                                        onChange={e => setText3(e.target.value)} 
                                        disabled={isRecording}
                                        className="w-full bg-[#13151c] border border-white/10 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 transition-all font-medium shadow-inner" 
                                    />
                                </div>
                                <div className="pt-4 border-t border-white/10 space-y-4">
                                    <div className="space-y-1.5">
                                        <label className="text-[11px] font-semibold text-slate-400 uppercase tracking-wider">Texto del Logo</label>
                                        <input 
                                            type="text" 
                                            value={logoText} 
                                            onChange={e => setLogoText(e.target.value)} 
                                            disabled={isRecording}
                                            className="w-full bg-[#13151c] border border-white/10 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-blue-500 transition-all shadow-inner" 
                                        />
                                    </div>
                                    <div className="space-y-1.5">
                                        <label className="text-[11px] font-semibold text-slate-400 uppercase tracking-wider">Fuente / Créditos</label>
                                        <input 
                                            type="text" 
                                            value={sourceText} 
                                            onChange={e => setSourceText(e.target.value)} 
                                            disabled={isRecording}
                                            className="w-full bg-[#13151c] border border-white/10 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-blue-500 transition-all shadow-inner" 
                                        />
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div className="mt-8 space-y-3 shrink-0 pt-4 border-t border-white/10">
                            <button 
                                onClick={() => playAnimation(false)} 
                                disabled={isPlaying}
                                className={`w-full py-3.5 rounded-xl font-semibold text-sm transition-all flex justify-center items-center gap-2 border ${isPlaying ? 'bg-white/5 border-white/5 text-slate-500 cursor-not-allowed' : 'bg-white/10 hover:bg-white/15 border-white/15 text-white shadow-lg'}`}
                            >
                                <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                                Previsualizar Animación
                            </button>
                            <button 
                                onClick={() => playAnimation(true)} 
                                disabled={isRecording || isPlaying}
                                className={`w-full py-4 rounded-xl font-bold text-sm transition-all flex justify-center items-center gap-2.5 shadow-xl ${isRecording || isPlaying ? 'bg-blue-600/50 text-slate-300 cursor-not-allowed' : 'bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white shadow-blue-500/25 active:scale-[0.99]'}`}
                            >
                                <div className={`w-3 h-3 rounded-full bg-white ${isRecording ? 'animate-ping' : 'animate-pulse'}`}></div>
                                {isRecording ? 'Renderizando Video...' : 'Exportar a WebM'}
                            </button>
                        </div>
                    </div>

                    {/* Main Preview Workspace */}
                    <div className="flex-1 p-6 lg:p-12 flex flex-col items-center justify-center bg-[#050608] relative overflow-hidden">
                        <div className="absolute w-[600px] h-[600px] bg-blue-600/10 rounded-full blur-[140px] pointer-events-none"></div>

                        <div className="w-full max-w-5xl relative z-10 flex flex-col items-center">
                            <div className="canvas-container">
                                <canvas 
                                    ref={canvasRef} 
                                    width="1920" 
                                    height="1080"
                                ></canvas>
                                
                                {isRecording && (
                                    <div className="recording-overlay flex-col gap-4">
                                        <div className="text-white font-bold text-xl flex items-center gap-3">
                                            <div className="w-4 h-4 bg-blue-500 rounded-full animate-ping"></div>
                                            Renderizando Frame a Frame (60 FPS)
                                        </div>
                                        <div className="w-72 bg-white/10 h-2 rounded-full overflow-hidden p-0.5 border border-white/10">
                                            <div className="h-full bg-gradient-to-r from-blue-500 to-cyan-400 rounded-full transition-all duration-75" style={{ width: `${progress}%` }}></div>
                                        </div>
                                        <span className="text-xs font-mono text-blue-400 font-bold">{Math.round(progress)}% Completo</span>
                                    </div>
                                )}
                            </div>
                            <div className="mt-4 flex items-center justify-between w-full text-xs text-slate-400 px-2 font-medium">
                                <div className="flex items-center gap-2">
                                    <span className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                                    <span>Motor Canvas HD Activo</span>
                                </div>
                                <div className="bg-white/5 border border-white/10 px-3 py-1 rounded-full text-slate-300">
                                    Resolución: 1920x1080 • Formato WebM VP9
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
        
        setTimeout(() => {
            if(window.lucide) window.lucide.createIcons();
        }, 100);
    </script>
</body>
</html>
