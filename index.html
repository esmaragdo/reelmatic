<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Motion Graphics Generator</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        body { font-family: 'Montserrat', sans-serif; background-color: #0f172a; color: white; }
        .canvas-container { position: relative; width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 0.5rem; overflow: hidden; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); }
        /* El canvas real estará a 1920x1080 para calidad HD, pero se adaptará al contenedor por CSS */
        canvas { width: 100%; height: 100%; display: block; }
        
        /* Animación de escaneo para la UI de grabación */
        @keyframes scanline {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(100vh); }
        }
        .recording-overlay {
            position: absolute; inset: 0; border: 4px solid #ef4444; z-index: 50; pointer-events: none;
            display: flex; justify-content: center; align-items: center; background: rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback } = React;

        // Funciones de suavizado (Easing) para la animación
        const easeOutQuart = x => 1 - Math.pow(1 - x, 4);
        const easeOutExpo = x => x === 1 ? 1 : 1 - Math.pow(2, -10 * x);
        const easeOutBack = x => {
            const c1 = 1.70158;
            const c3 = c1 + 1;
            return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2);
        };

        const App = () => {
            // Estado de la aplicación
            const [text1, setText1] = useState("2023 Top Ten");
            const [text2, setText2] = useState("de los Destinos Turísticos");
            const [text3, setText3] = useState("en el Mundo.");
            const [logoText, setLogoText] = useState("caribe.mx");
            const [sourceText, setSourceText] = useState("Fuente: Organización Mundial del Turismo");
            
            const [isRecording, setIsRecording] = useState(false);
            const [isPlaying, setIsPlaying] = useState(false);
            const [progress, setProgress] = useState(0);

            const canvasRef = useRef(null);
            const animationRef = useRef(null);
            const mediaRecorderRef = useRef(null);
            const chunksRef = useRef([]);

            const drawFrame = useCallback((ctx, timeMs, texts) => {
                const width = 1920;
                const height = 1080;
                
                // Limpiar lienzo
                ctx.fillStyle = '#e8e8e8';
                ctx.fillRect(0, 0, width, height);

                // Viñeta (Vignette)
                const gradient = ctx.createRadialGradient(width/2, height/2, height*0.4, width/2, height/2, width*0.8);
                gradient.addColorStop(0, 'rgba(0,0,0,0)');
                gradient.addColorStop(1, 'rgba(0,0,0,0.4)');
                ctx.fillStyle = gradient;
                ctx.fillRect(0, 0, width, height);

                // Tiempos de animación (en milisegundos)
                const t1 = Math.max(0, Math.min(1, (timeMs - 400) / 1000));  // Línea 1 (Slide right)
                const t2 = Math.max(0, Math.min(1, (timeMs - 1100) / 1000)); // Línea 2 (Fade up)
                const t3 = Math.max(0, Math.min(1, (timeMs - 1800) / 1000)); // Línea 3 (Fade in)
                const t4 = Math.max(0, Math.min(1, (timeMs - 2300) / 900));  // Línea de subrayado
                const tSource = Math.max(0, Math.min(1, (timeMs - 2700) / 1000)); // Fuente (Fade in)
                const tLogo = Math.max(0, Math.min(1, (timeMs - 3000) / 1000)); // Logo (Fade down)

                // Posiciones base centrales
                const startX = width * 0.25;
                const startY = height * 0.35;

                // --- LINEA 1 ---
                if (t1 > 0) {
                    ctx.save();
                    ctx.font = '800 100px Montserrat';
                    const textMetrics = ctx.measureText(texts.t1);
                    const padX = 35;
                    const padY = 25;
                    const boxW = textMetrics.width + (padX * 2);
                    const boxH = 130;

                    // Máscara de revelado
                    ctx.beginPath();
                    ctx.rect(startX, startY, boxW, boxH);
                    ctx.clip();

                    const slideOffset = (1 - easeOutExpo(t1)) * boxW;
                    
                    ctx.fillStyle = '#000000';
                    ctx.fillRect(startX - slideOffset, startY, boxW, boxH);
                    
                    ctx.fillStyle = '#ffffff';
                    ctx.textBaseline = 'top';
                    ctx.fillText(texts.t1, startX + padX - slideOffset, startY + padY);
                    ctx.restore();
                }

                // --- LINEA 2 ---
                if (t2 > 0) {
                    ctx.save();
                    const easeVal = easeOutExpo(t2);
                    ctx.globalAlpha = easeVal;
                    ctx.font = '300 80px Montserrat';
                    
                    const yOffset = (1 - easeVal) * 50; // Sube desde abajo
                    const line2X = startX + 20; // Alineado ligeramente hacia la derecha del bloque negro
                    const line2Y = startY + 160 + yOffset;

                    ctx.fillStyle = '#000000';
                    ctx.textBaseline = 'top';
                    ctx.fillText(texts.t2, line2X, line2Y);
                    ctx.restore();
                }

                // --- LINEA 3 ---
                if (t3 > 0) {
                    ctx.save();
                    const easeVal = easeOutExpo(t3);
                    ctx.globalAlpha = easeVal;
                    ctx.font = '800 110px Montserrat';
                    
                    const textMetrics = ctx.measureText(texts.t3);
                    const line3X = startX + 150; // Desplazado a la derecha para look dinámico
                    const line3Y = startY + 280;

                    const yOffset = (1 - easeVal) * 30;

                    ctx.fillStyle = '#000000';
                    ctx.textBaseline = 'top';
                    ctx.fillText(texts.t3, line3X, line3Y + yOffset);

                    // --- LÍNEA DE SUBRAYADO BAJO LÍNEA 3 ---
                    if (t4 > 0) {
                        const lineW = textMetrics.width * easeOutExpo(t4);
                        ctx.fillStyle = '#000000';
                        ctx.fillRect(line3X, line3Y + yOffset + 130, lineW, 8);
                    }

                    ctx.restore();
                }

                // --- FUENTE (Inferior Izquierda) ---
                if (tSource > 0) {
                    ctx.save();
                    ctx.globalAlpha = easeOutQuart(tSource) * 0.6; // Opacidad elegante
                    ctx.font = '500 28px Montserrat';
                    ctx.fillStyle = '#000000';
                    ctx.textBaseline = 'bottom';
                    
                    const xOffset = (1 - easeOutQuart(tSource)) * -20;
                    ctx.fillText(texts.source, 80 + xOffset, height - 60);
                    ctx.restore();
                }

                // --- LOGO ---
                if (tLogo > 0) {
                    ctx.save();
                    const easeVal = easeOutBack(tLogo);
                    ctx.globalAlpha = Math.min(1, tLogo * 2);
                    ctx.font = '700 30px Montserrat';
                    const logoMetrics = ctx.measureText(texts.logo);
                    const padX = 20;
                    const padY = 15;
                    const boxW = logoMetrics.width + (padX * 2);
                    const boxH = 60;
                    
                    const logoX = width - boxW - 80;
                    const logoY = 80;
                    
                    const yOffset = (1 - easeVal) * -40;
                    
                    ctx.fillStyle = '#000000';
                    ctx.fillRect(logoX, logoY + yOffset, boxW, boxH);
                    
                    ctx.fillStyle = '#ffffff';
                    ctx.textBaseline = 'top';
                    ctx.fillText(texts.logo, logoX + padX, logoY + padY + yOffset);
                    ctx.restore();
                }

            }, []);

            const playAnimation = useCallback((record = false) => {
                if (isPlaying) return;
                
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                const startTime = performance.now();
                const duration = 5000; // 5 segundos de animación
                
                const currentTexts = { t1: text1, t2: text2, t3: text3, logo: logoText, source: sourceText };

                setIsPlaying(true);
                if (record) {
                    setIsRecording(true);
                    setProgress(0);
                    chunksRef.current = [];
                    // Capturar a 60fps
                    const stream = canvas.captureStream(60); 
                    // Usar vp9 para mejor calidad WebM
                    mediaRecorderRef.current = new MediaRecorder(stream, { mimeType: 'video/webm; codecs=vp9' });
                    
                    mediaRecorderRef.current.ondataavailable = e => {
                        if (e.data.size > 0) chunksRef.current.push(e.data);
                    };
                    
                    mediaRecorderRef.current.onstop = () => {
                        const blob = new Blob(chunksRef.current, { type: 'video/webm' });
                        const url = URL.createObjectURL(blob);
                        const a = document.createElement('a');
                        a.href = url;
                        a.download = `motion_graphic_${Date.now()}.webm`;
                        a.click();
                        URL.revokeObjectURL(url);
                        setIsRecording(false);
                        setProgress(0);
                    };
                    
                    mediaRecorderRef.current.start();
                }

                const animate = (currentTime) => {
                    const elapsed = currentTime - startTime;
                    drawFrame(ctx, elapsed, currentTexts);
                    
                    if (record) {
                        setProgress(Math.min(100, (elapsed / duration) * 100));
                    }

                    if (elapsed < duration) {
                        animationRef.current = requestAnimationFrame(animate);
                    } else {
                        setIsPlaying(false);
                        if (record && mediaRecorderRef.current) {
                            mediaRecorderRef.current.stop();
                        }
                    }
                };
                
                animationRef.current = requestAnimationFrame(animate);
            }, [drawFrame, isPlaying, text1, text2, text3, logoText, sourceText]);

            // Detener animación si se desmonta
            useEffect(() => {
                return () => {
                    if (animationRef.current) cancelAnimationFrame(animationRef.current);
                };
            }, []);

            // Renderizado inicial al cargar fuentes
            useEffect(() => {
                document.fonts.ready.then(() => {
                    const canvas = canvasRef.current;
                    const ctx = canvas.getContext('2d');
                    // Dibujamos el frame final (5000ms) para que sirva de preview
                    drawFrame(ctx, 5000, { t1: text1, t2: text2, t3: text3, logo: logoText, source: sourceText });
                });
            }, [text1, text2, text3, logoText, sourceText, drawFrame]);

            return (
                <div className="min-h-screen flex flex-col md:flex-row">
                    {/* Barra lateral de controles */}
                    <div className="w-full md:w-96 bg-slate-900 border-r border-slate-800 p-6 flex flex-col shadow-xl z-10">
                        <div className="mb-8">
                            <h1 className="text-2xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-emerald-400">
                                Motion Generator
                            </h1>
                            <p className="text-slate-400 text-sm mt-1">Crea y exporta en WebM 1080p</p>
                        </div>

                        <div className="space-y-4 flex-grow">
                            <div>
                                <label className="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Línea 1 (Bloque Negro)</label>
                                <input type="text" value={text1} onChange={e => setText1(e.target.value)} disabled={isRecording}
                                    className="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-2 focus:ring-2 focus:ring-blue-500 focus:outline-none transition-all" />
                            </div>
                            <div>
                                <label className="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Línea 2 (Ligera)</label>
                                <input type="text" value={text2} onChange={e => setText2(e.target.value)} disabled={isRecording}
                                    className="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-2 focus:ring-2 focus:ring-blue-500 focus:outline-none transition-all" />
                            </div>
                            <div>
                                <label className="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Línea 3 (Negrita con línea)</label>
                                <input type="text" value={text3} onChange={e => setText3(e.target.value)} disabled={isRecording}
                                    className="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-2 focus:ring-2 focus:ring-blue-500 focus:outline-none transition-all" />
                            </div>
                            <div className="pt-4 border-t border-slate-800">
                                <label className="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Texto del Logo</label>
                                <input type="text" value={logoText} onChange={e => setLogoText(e.target.value)} disabled={isRecording}
                                    className="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-2 focus:ring-2 focus:ring-blue-500 focus:outline-none transition-all mb-4" />
                                
                                <label className="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Fuente (Abajo Izquierda)</label>
                                <input type="text" value={sourceText} onChange={e => setSourceText(e.target.value)} disabled={isRecording}
                                    className="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-2 focus:ring-2 focus:ring-blue-500 focus:outline-none transition-all" />
                            </div>
                        </div>

                        <div className="mt-8 space-y-3">
                            <button 
                                onClick={() => playAnimation(false)} 
                                disabled={isPlaying}
                                className={`w-full py-3 rounded-lg font-bold transition-all flex justify-center items-center gap-2 ${isPlaying ? 'bg-slate-800 text-slate-500 cursor-not-allowed' : 'bg-slate-700 hover:bg-slate-600 text-white'}`}
                            >
                                <i data-lucide="play" className="w-5 h-5"></i>
                                Vista Previa
                            </button>
                            <button 
                                onClick={() => playAnimation(true)} 
                                disabled={isRecording || isPlaying}
                                className={`w-full py-4 rounded-lg font-bold transition-all flex justify-center items-center gap-2 shadow-lg ${isRecording || isPlaying ? 'bg-slate-800 text-slate-500 cursor-not-allowed' : 'bg-red-500 hover:bg-red-600 text-white hover:shadow-red-500/25'}`}
                            >
                                <div className={`w-3 h-3 rounded-full bg-white ${isRecording ? 'animate-pulse' : ''}`}></div>
                                {isRecording ? 'Renderizando Video...' : 'Exportar a WebM'}
                            </button>
                        </div>
                    </div>

                    {/* Área principal: Canvas Preview */}
                    <div className="flex-1 p-4 md:p-10 flex items-center justify-center bg-[#0a0a0a]">
                        <div className="w-full max-w-5xl relative">
                            {/* Proporción 16:9 estricta */}
                            <div className="canvas-container">
                                <canvas 
                                    ref={canvasRef} 
                                    width="1920" 
                                    height="1080"
                                ></canvas>
                                
                                {isRecording && (
                                    <div className="recording-overlay flex-col gap-4">
                                        <div className="text-white font-bold text-2xl flex items-center gap-3">
                                            <div className="w-4 h-4 bg-red-500 rounded-full animate-ping"></div>
                                            Grabando Frame a Frame (60fps)
                                        </div>
                                        <div className="w-64 bg-slate-800 h-2 rounded-full overflow-hidden">
                                            <div className="h-full bg-red-500 transition-all duration-75" style={{ width: `${progress}%` }}></div>
                                        </div>
                                    </div>
                                )}
                            </div>
                            <p className="text-center text-slate-500 text-sm mt-4">
                                Vista previa escalada. El archivo descargado será exactamente 1920x1080 píxeles.
                            </p>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
        
        // Inicializar iconos de Lucide
        setTimeout(() => {
            if(window.lucide) window.lucide.createIcons();
        }, 100);
    </script>
</body>
</html>
