<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReelMatic.Pro Studio</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        body { font-family: 'Montserrat', sans-serif; background-color: #0b0c10; color: #f1f5f9; overflow-x: hidden; }
        .canvas-container { position: relative; width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 1rem; overflow: hidden; box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.08); display: flex; align-items: center; justify-content: center; }
        canvas { display: block; width: 100% !important; height: 100% !important; object-fit: contain; }
        
        .recording-overlay {
            position: absolute; inset: 0; border: 3px solid #3b82f6; z-index: 50; pointer-events: none;
            display: flex; justify-content: center; align-items: center; background: rgba(0,0,0,0.75); backdrop-filter: blur(8px);
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.15); border-radius: 9999px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.25); }
    </style>
</head>
<body class="bg-[#08090c] text-slate-100 min-h-screen flex flex-col">

    <div id="root" class="flex-1 flex flex-col h-screen"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback } = React;

        const easeOutQuart = x => 1 - Math.pow(1 - x, 4);
        const easeOutExpo = x => x === 1 ? 1 : 1 - Math.pow(2, -10 * x);
        const easeOutBack = x => {
            const c1 = 1.70158;
            const c3 = c1 + 1;
            return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2);
        };
        const elasticOut = x => {
            const c4 = (2 * Math.PI) / 3;
            return x === 0 ? 0 : x === 1 ? 1 : Math.pow(2, -10 * x) * Math.sin((x * 10 - 0.75) * c4) + 1;
        };

        const App = () => {
            const [text1, setText1] = useState("2023 Top Ten");
            const [text2, setText2] = useState("de los Destinos Turísticos");
            const [text3, setText3] = useState("en el Mundo.");
            const [logoText, setLogoText] = useState("ReelMatic.Pro");
            const [sourceText, setSourceText] = useState("Fuente: Organización Mundial del Turismo");
            
            const [animateLogo, setAnimateLogo] = useState(true);
            const [animateSource, setAnimateSource] = useState(true);

            const [sourceAlign, setSourceAlign] = useState("left");
            const [textOrder, setTextOrder] = useState("standard");

            const [useFramedPhoto, setUseFramedPhoto] = useState(false);
            const [framedPhotoImg, setFramedPhotoImg] = useState(null);
            const [photoCaption, setPhotoCaption] = useState("Playa Paraíso, México");
            const [frameVariant, setFrameVariant] = useState("polaroid");
            const [framedOffsetX, setFramedOffsetX] = useState(0);
            const [framedOffsetY, setFramedOffsetY] = useState(0);

            const [useCharacter, setUseCharacter] = useState(false);
            const [characterImg, setCharacterImg] = useState(null);
            const [charName, setCharName] = useState("Dra. Elena Ruiz");
            const [charRole, setCharRole] = useState("Directora de Turismo Global");
            const [charVariant, setCharVariant] = useState("standard_card");
            const [charOffsetX, setCharOffsetX] = useState(0);
            const [charOffsetY, setCharOffsetY] = useState(0);
            
            const [partyLogoImg, setPartyLogoImg] = useState(null);
            const [isQuoteMode, setIsQuoteMode] = useState(false);
            const [quoteType, setQuoteType] = useState("classic"); 
            const [quoteParagraph, setQuoteParagraph] = useState("La innovación distingue a los líderes de los seguidores. El diseño no es solo lo que parece, es cómo funciona.");

            const [useVideoOverlayBackdrop, setUseVideoOverlayBackdrop] = useState(false);
            const [overlayGuideOpacity, setOverlayGuideOpacity] = useState(true);

            const [motionStyle, setMotionStyle] = useState("dynamic");
            const [bgColorChoice, setBgColorChoice] = useState("white");
            const [paletteChoice, setPaletteChoice] = useState("minimal");
            const [bgType, setBgType] = useState("gradient");

            const [isRecording, setIsRecording] = useState(false);
            const [isPlaying, setIsPlaying] = useState(false);
            const [progress, setProgress] = useState(0);

            const canvasRef = useRef(null);
            const animationRef = useRef(null);
            const mediaRecorderRef = useRef(null);
            const chunksRef = useRef([]);

            // Adjusted drawImageCover with internal offset support (offsetX, offsetY)
            const drawImageCoverWithOffset = (ctx, img, x, y, w, h, offsetX = 0, offsetY = 0) => {
                const imgRatio = img.width / img.height;
                const targetRatio = w / h;
                let sWidth = img.width;
                let sHeight = img.height;
                let sX = 0;
                let sY = 0;

                if (imgRatio > targetRatio) {
                    sWidth = img.height * targetRatio;
                    sX = (img.width - sWidth) / 2;
                } else {
                    sHeight = img.width / targetRatio;
                    sY = (img.height - sHeight) / 2;
                }

                // Apply user fine-tuning offset inside the fixed frame container
                sX -= offsetX * (sWidth / w);
                sY -= offsetY * (sHeight / h);

                ctx.drawImage(img, sX, sY, sWidth, sHeight, x, y, w, h);
            };

            const drawFrame = useCallback((ctx, timeMs, texts, cfg) => {
                const width = 1920;
                const height = 1080;
                
                let bgHex = '#f8fafc';
                let isDark = false;

                if (cfg.bg === 'grey') { bgHex = '#334155'; isDark = true; }
                else if (cfg.bg === 'black') { bgHex = '#0c0d12'; isDark = true; }
                else if (cfg.bg === 'navy') { bgHex = '#191929'; isDark = true; }
                else if (cfg.bg === 'light_navy') { bgHex = '#F0F0F5'; isDark = false; }
                else if (cfg.bg === 'deep_navy') { bgHex = '#000033'; isDark = true; }
                else if (cfg.bg === 'light_slate') { bgHex = '#EAEAF5'; isDark = false; }
                else if (cfg.bg === 'ivory') { bgHex = '#FAFAF7'; isDark = false; }
                else if (cfg.bg === 'crimson') { bgHex = '#A32929'; isDark = true; }
                else if (cfg.bg === 'melocoton') { bgHex = '#F9E1DC'; isDark = false; }
                else if (cfg.bg === 'caoba') { bgHex = '#692113'; isDark = true; }
                else if (cfg.bg === 'rojo_claro') { bgHex = '#FFD6D6'; isDark = false; }
                else if (cfg.bg === 'rojo_oscuro') { bgHex = '#3D0000'; isDark = true; }
                else if (cfg.bg === 'oliva') { bgHex = '#869108'; isDark = true; }
                else if (cfg.bg === 'rosa_coral') { bgHex = '#EF6C77'; isDark = false; }
                else if (cfg.bg === 'durazno') { bgHex = '#EFA36C'; isDark = false; }
                else if (cfg.bg === 'verde_bosque') { bgHex = '#419108'; isDark = true; }
                else if (cfg.bg === 'amarillo_claro') { bgHex = '#FFE34C'; isDark = false; }
                else if (cfg.bg === 'amarillo_oscuro') { bgHex = '#CCAC00'; isDark = false; }

                ctx.fillStyle = bgHex;
                ctx.fillRect(0, 0, width, height);

                if (cfg.bgType && cfg.bgType !== 'gradient') {
                    ctx.save();
                    const isDarkBg = ['grey', 'black', 'navy', 'deep_navy', 'crimson', 'caoba', 'rojo_oscuro', 'oliva', 'verde_bosque', 'amarillo_oscuro'].includes(cfg.bg);
                    ctx.fillStyle = isDarkBg ? 'rgba(255,255,255,0.06)' : 'rgba(0,0,0,0.06)';
                    ctx.strokeStyle = isDarkBg ? 'rgba(255,255,255,0.07)' : 'rgba(0,0,0,0.07)';
                    ctx.lineWidth = 1.5;

                    if (cfg.bgType === 'pattern_dots') {
                        const spacing = 40;
                        for (let x = 0; x <= width; x += spacing) {
                            for (let y = 0; y <= height; y += spacing) {
                                ctx.beginPath();
                                ctx.arc(x, y, 3, 0, Math.PI * 2);
                                ctx.fill();
                            }
                        }
                    } else if (cfg.bgType === 'pattern_grid') {
                        const spacing = 60;
                        ctx.beginPath();
                        for (let x = 0; x <= width; x += spacing) { ctx.moveTo(x, 0); ctx.lineTo(x, height); }
                        for (let y = 0; y <= height; y += spacing) { ctx.moveTo(0, y); ctx.lineTo(width, y); }
                        ctx.stroke();
                    } else if (cfg.bgType === 'pattern_stripes') {
                        const spacing = 40;
                        ctx.beginPath();
                        for (let i = -height; i <= width; i += spacing) {
                            ctx.moveTo(i, 0); ctx.lineTo(i + height, height);
                        }
                        ctx.stroke();
                    } else if (cfg.bgType === 'pattern_cross') {
                        const spacing = 50;
                        const size = 6;
                        ctx.beginPath();
                        for (let x = 0; x <= width; x += spacing) {
                            for (let y = 0; y <= height; y += spacing) {
                                ctx.moveTo(x - size, y); ctx.lineTo(x + size, y);
                                ctx.moveTo(x, y - size); ctx.lineTo(x, y + size);
                            }
                        }
                        ctx.stroke();
                    } else if (cfg.bgType === 'pattern_hex') {
                        const r = 35;
                        const dx = r * 1.732;
                        const dy = r * 1.5;
                        ctx.beginPath();
                        for (let y = 0; y <= height + r; y += dy) {
                            let rowIdx = Math.round(y / dy);
                            let xOffset = (rowIdx % 2 === 0) ? 0 : dx / 2;
                            for (let x = -r; x <= width + r; x += dx) {
                                for (let i = 0; i < 6; i++) {
                                    const angle = (i * Math.PI) / 3;
                                    const hx = x + xOffset + r * Math.cos(angle);
                                    const hy = y + r * Math.sin(angle);
                                    if (i === 0) ctx.moveTo(hx, hy);
                                    else ctx.lineTo(hx, hy);
                                }
                                ctx.closePath();
                            }
                        }
                        ctx.stroke();
                    } else if (cfg.bgType === 'pattern_waves') {
                        const cx = width / 2;
                        const cy = height / 2;
                        ctx.beginPath();
                        for (let radius = 80; radius < Math.max(width, height); radius += 90) {
                            ctx.moveTo(cx + radius, cy);
                            ctx.arc(cx, cy, radius, 0, Math.PI * 2);
                        }
                        ctx.stroke();
                    } else if (cfg.bgType === 'pattern_circuit') {
                        const spacing = 120;
                        ctx.beginPath();
                        for (let x = 60; x <= width; x += spacing) {
                            for (let y = 60; y <= height; y += spacing) {
                                ctx.arc(x, y, 4, 0, Math.PI * 2);
                                ctx.fill();
                                ctx.moveTo(x, y);
                                ctx.lineTo(x + (x % 240 === 0 ? spacing : 0), y + (y % 240 === 0 ? spacing : 0));
                            }
                        }
                        ctx.stroke();
                    }
                    ctx.restore();
                }

                if (cfg.useVideoOverlayBackdrop) {
                    ctx.save();
                    const boxW = width * 0.48;
                    const boxH = height * 0.88;
                    const boxX = 60;
                    const boxY = (height - boxH) / 2;

                    ctx.fillStyle = isDark ? 'rgba(255, 255, 255, 0.02)' : 'rgba(0, 0, 0, 0.02)';
                    ctx.beginPath();
                    ctx.roundRect(boxX, boxY, boxW, boxH, 24);
                    ctx.fill();
                    ctx.restore();
                }

                const gradient = ctx.createRadialGradient(width/2, height/2, height*0.4, width/2, height/2, width*0.8);
                gradient.addColorStop(0, 'rgba(0,0,0,0)');
                gradient.addColorStop(1, isDark ? 'rgba(0,0,0,0.85)' : 'rgba(0,0,0,0.15)');
                ctx.fillStyle = gradient;
                ctx.fillRect(0, 0, width, height);

                let primaryColor = isDark ? '#ffffff' : '#000000';
                let accentColor = primaryColor;
                let boxBgColor = primaryColor;
                let boxTextColor = isDark ? '#000000' : '#ffffff';

                if (cfg.palette === 'vibrant') { accentColor = '#3b82f6'; }
                else if (cfg.palette === 'neon') { accentColor = '#06b6d4'; }
                else if (cfg.palette === 'navy_palette') { primaryColor = '#ADADEB'; accentColor = '#B2B200'; boxBgColor = '#000080'; boxTextColor = '#F0F0F5'; }
                else if (cfg.palette === 'navy_lime') { primaryColor = '#8C8CD9'; accentColor = '#8CE236'; boxBgColor = '#000080'; boxTextColor = '#EAEAF5'; }
                else if (cfg.palette === 'rosa_navy') { primaryColor = '#000080'; accentColor = '#0F8A0F'; boxBgColor = '#A32929'; boxTextColor = '#F1B1B1'; }
                else if (cfg.palette === 'terracota') { primaryColor = '#692113'; accentColor = '#E2725B'; boxBgColor = '#AE371F'; boxTextColor = '#F9E1DC'; }
                else if (cfg.palette === 'rojo_intenso') { primaryColor = '#FFD6D6'; accentColor = '#FF0000'; boxBgColor = '#8F0000'; boxTextColor = '#FF8F8F'; }
                else if (cfg.palette === 'otono') { primaryColor = '#869108'; accentColor = '#FF8000'; boxBgColor = '#EF6C77'; boxTextColor = '#FF4C1F'; }
                else if (cfg.palette === 'citrico') { primaryColor = '#419108'; accentColor = '#FFFF00'; boxBgColor = '#EFA36C'; boxTextColor = '#FFBC1F'; }
                else if (cfg.palette === 'amarillo_oro') { primaryColor = '#CCAC00'; accentColor = '#FFD700'; boxBgColor = '#FFE34C'; boxTextColor = '#000033'; }

                let t1, t2, t3, t4, tSource, tLogo;
                if (cfg.motion === 'spring') {
                    t1 = Math.max(0, Math.min(1, timeMs / 700));
                    t2 = Math.max(0, Math.min(1, (timeMs - 400) / 700));
                    t3 = Math.max(0, Math.min(1, (timeMs - 800) / 700));
                    t4 = Math.max(0, Math.min(1, (timeMs - 1200) / 600));
                    tSource = Math.max(0, Math.min(1, (timeMs - 1500) / 600));
                    tLogo = Math.max(0, Math.min(1, (timeMs - 1700) / 600));
                } else if (cfg.motion === 'dynamic') {
                    t1 = Math.max(0, Math.min(1, (timeMs - 200) / 800));
                    t2 = Math.max(0, Math.min(1, (timeMs - 800) / 800));
                    t3 = Math.max(0, Math.min(1, (timeMs - 1400) / 800));
                    t4 = Math.max(0, Math.min(1, (timeMs - 1900) / 700));
                    tSource = Math.max(0, Math.min(1, (timeMs - 2200) / 800));
                    tLogo = Math.max(0, Math.min(1, (timeMs - 2500) / 800));
                } else {
                    t1 = Math.max(0, Math.min(1, (timeMs - 400) / 1000));
                    t2 = Math.max(0, Math.min(1, (timeMs - 1100) / 1000));
                    t3 = Math.max(0, Math.min(1, (timeMs - 1800) / 1000));
                    t4 = Math.max(0, Math.min(1, (timeMs - 2300) / 900));
                    tSource = Math.max(0, Math.min(1, (timeMs - 2700) / 1000));
                    tLogo = Math.max(0, Math.min(1, (timeMs - 3000) / 1000));
                }

                const hasVisualLeft = cfg.useFramed || cfg.useChar || cfg.useVideoOverlayBackdrop;
                
                let startX = hasVisualLeft ? (cfg.useFramed ? width * 0.48 : width * 0.52) : width * 0.22;
                const startY = height * 0.35;

                let baseY1 = startY;
                let baseY2 = startY + 160;
                let baseY3 = startY + 280;

                if (cfg.textOrder === "subtitleTop") {
                    baseY2 = startY - 60; 
                    baseY1 = startY + 40; 
                    baseY3 = startY + 200; 
                } else if (cfg.textOrder === "blockBottom") {
                    baseY2 = startY - 80; 
                    baseY3 = startY + 20; 
                    baseY1 = startY + 220; 
                }

                if (cfg.useFramed && !cfg.useVideoOverlayBackdrop) {
                    const animProgress = cfg.motion === 'spring' ? elasticOut(t1) : easeOutExpo(t1);
                    const slideX = (1 - animProgress) * -500;

                    if (cfg.frameVariant === 'polaroid') {
                        const tiltAngle = -4 * (Math.PI / 180);
                        ctx.save();
                        ctx.translate(120 + slideX, 140);
                        ctx.rotate(tiltAngle);

                        ctx.shadowColor = 'rgba(0,0,0,0.35)';
                        ctx.shadowBlur = 40;
                        ctx.shadowOffsetX = 10;
                        ctx.shadowOffsetY = 20;
                        ctx.fillStyle = isDark ? '#1e2028' : '#ffffff';
                        ctx.fillRect(0, 0, 620, 760);

                        ctx.shadowColor = 'transparent';
                        ctx.beginPath();
                        ctx.rect(40, 40, 540, 580);
                        ctx.clip();

                        if (cfg.framedImgObj) {
                            drawImageCoverWithOffset(ctx, cfg.framedImgObj, 40, 40, 540, 580, cfg.framedOffsetX, cfg.framedOffsetY);
                        } else {
                            ctx.fillStyle = '#cbd5e1';
                            ctx.fillRect(40, 40, 540, 580);
                            ctx.fillStyle = '#475569';
                            ctx.font = '600 24px Montserrat';
                            ctx.fillText("Sin Imagen", 230, 310);
                        }
                        ctx.restore();

                        if (texts.photoCaption) {
                            ctx.save();
                            ctx.translate(120 + slideX, 140);
                            ctx.rotate(tiltAngle);
                            ctx.font = '500 24px Montserrat';
                            ctx.fillStyle = primaryColor;
                            ctx.textBaseline = 'top';
                            ctx.textAlign = 'center';
                            ctx.fillText(texts.photoCaption, 310, 670);
                            ctx.restore();
                        }
                    } else if (cfg.frameVariant === 'tech') {
                        ctx.save();
                        ctx.translate(100 + slideX, 120);
                        ctx.shadowColor = 'rgba(0,0,0,0.3)';
                        ctx.shadowBlur = 30;
                        ctx.shadowOffsetY = 15;
                        
                        ctx.fillStyle = 'rgba(15, 23, 42, 0.85)';
                        ctx.strokeStyle = accentColor;
                        ctx.lineWidth = 3;
                        ctx.beginPath();
                        ctx.roundRect(0, 0, 580, 680, 20);
                        ctx.fill();
                        ctx.stroke();

                        ctx.shadowColor = 'transparent';
                        ctx.beginPath();
                        ctx.roundRect(35, 35, 510, 530, 12);
                        ctx.clip();

                        if (cfg.framedImgObj) {
                            drawImageCoverWithOffset(ctx, cfg.framedImgObj, 35, 35, 510, 530, cfg.framedOffsetX, cfg.framedOffsetY);
                        } else {
                            ctx.fillStyle = '#334155';
                            ctx.fillRect(35, 35, 510, 530);
                        }
                        ctx.restore();

                        if (texts.photoCaption) {
                            ctx.save();
                            ctx.translate(100 + slideX, 120);
                            ctx.font = '600 22px Montserrat';
                            ctx.fillStyle = primaryColor;
                            ctx.textBaseline = 'top';
                            ctx.textAlign = 'center';
                            ctx.fillText(texts.photoCaption, 290, 595);
                            ctx.restore();
                        }
                    } else if (cfg.frameVariant === 'circle') {
                        ctx.save();
                        ctx.translate(140 + slideX, 160);
                        ctx.shadowColor = 'rgba(0,0,0,0.4)';
                        ctx.shadowBlur = 40;
                        
                        const radius = 280;
                        ctx.beginPath();
                        ctx.arc(radius, radius, radius, 0, Math.PI * 2);
                        ctx.fillStyle = accentColor;
                        ctx.fill();
                        ctx.clip();

                        if (cfg.framedImgObj) {
                            drawImageCoverWithOffset(ctx, cfg.framedImgObj, 0, 0, radius * 2, radius * 2, cfg.framedOffsetX, cfg.framedOffsetY);
                        } else {
                            ctx.fillStyle = '#475569';
                            ctx.fillRect(0, 0, radius * 2, radius * 2);
                        }
                        ctx.restore();

                        if (texts.photoCaption) {
                            ctx.save();
                            ctx.translate(140 + slideX, 160);
                            ctx.font = '700 24px Montserrat';
                            ctx.fillStyle = primaryColor;
                            ctx.textBaseline = 'top';
                            ctx.textAlign = 'center';
                            ctx.fillText(texts.photoCaption, 280, 600);
                            ctx.restore();
                        }
                    } else if (cfg.frameVariant === 'offset') {
                        ctx.save();
                        ctx.translate(120 + slideX, 120);
                        
                        ctx.fillStyle = accentColor;
                        ctx.beginPath();
                        ctx.roundRect(30, 30, 540, 620, 16);
                        ctx.fill();

                        ctx.shadowColor = 'rgba(0,0,0,0.3)';
                        ctx.shadowBlur = 25;
                        ctx.fillStyle = isDark ? '#13151c' : '#ffffff';
                        ctx.beginPath();
                        ctx.roundRect(0, 0, 540, 620, 16);
                        ctx.fill();

                        ctx.shadowColor = 'transparent';
                        ctx.beginPath();
                        ctx.roundRect(35, 35, 470, 480, 12);
                        ctx.clip();

                        if (cfg.framedImgObj) {
                            drawImageCoverWithOffset(ctx, cfg.framedImgObj, 35, 35, 470, 480, cfg.framedOffsetX, cfg.framedOffsetY);
                        } else {
                            ctx.fillStyle = '#cbd5e1';
                            ctx.fillRect(35, 35, 470, 480);
                        }
                        ctx.restore();

                        if (texts.photoCaption) {
                            ctx.save();
                            ctx.translate(120 + slideX, 120);
                            ctx.font = '600 22px Montserrat';
                            ctx.fillStyle = primaryColor;
                            ctx.textBaseline = 'top';
                            ctx.textAlign = 'center';
                            ctx.fillText(texts.photoCaption, 270, 550);
                            ctx.restore();
                        }
                    } else if (cfg.frameVariant === 'magazine') {
                        ctx.save();
                        ctx.translate(100 + slideX, 100);
                        
                        ctx.shadowColor = 'rgba(0,0,0,0.35)';
                        ctx.shadowBlur = 35;
                        ctx.fillStyle = boxBgColor;
                        ctx.beginPath();
                        ctx.roundRect(0, 0, 580, 700, 12);
                        ctx.fill();

                        ctx.shadowColor = 'transparent';
                        ctx.beginPath();
                        ctx.roundRect(35, 35, 510, 510, 8);
                        ctx.clip();

                        if (cfg.framedImgObj) {
                            drawImageCoverWithOffset(ctx, cfg.framedImgObj, 35, 35, 510, 510, cfg.framedOffsetX, cfg.framedOffsetY);
                        } else {
                            ctx.fillStyle = '#475569';
                            ctx.fillRect(35, 35, 510, 510);
                        }
                        ctx.restore();

                        if (texts.photoCaption) {
                            ctx.save();
                            ctx.translate(100 + slideX, 100);
                            ctx.font = '800 26px Montserrat';
                            ctx.fillStyle = boxTextColor;
                            ctx.textBaseline = 'top';
                            ctx.textAlign = 'left';
                            ctx.fillText(texts.photoCaption.toUpperCase(), 40, 585);
                            ctx.restore();
                        }
                    } else if (cfg.frameVariant === 'invasive_bleed') {
                        ctx.save();
                        const animProgress = cfg.motion === 'spring' ? elasticOut(t1) : easeOutExpo(t1);
                        const slideX = (1 - animProgress) * -600;

                        ctx.translate(slideX, 0);
                        ctx.shadowColor = 'rgba(0,0,0,0.5)';
                        ctx.shadowBlur = 50;

                        ctx.beginPath();
                        ctx.rect(-100, 0, 850, height);
                        ctx.clip();

                        if (cfg.framedImgObj) {
                            drawImageCoverWithOffset(ctx, cfg.framedImgObj, -100, 0, 950, height, cfg.framedOffsetX, cfg.framedOffsetY);
                        } else {
                            ctx.fillStyle = '#334155';
                            ctx.fillRect(-100, 0, 950, height);
                        }

                        const gradBleed = ctx.createLinearGradient(650, 0, 850, 0);
                        gradBleed.addColorStop(0, 'rgba(0,0,0,0)');
                        gradBleed.addColorStop(1, 'rgba(0,0,0,0.7)');
                        ctx.fillStyle = gradBleed;
                        ctx.fillRect(550, 0, 300, height);

                        ctx.restore();

                        if (texts.photoCaption) {
                            ctx.save();
                            ctx.font = '700 22px Montserrat';
                            ctx.fillStyle = '#ffffff';

                        ctx.fillStyle = primaryColor;
                        ctx.textBaseline = 'top';
                        ctx.fillText(texts.t2, line2X, baseY2 + yOffset);
                        ctx.restore();
                    }

                        const easeVal = cfg.motion === 'spring' ? elasticOut(t3) : easeOutExpo(t3);
                        ctx.globalAlpha = easeVal;
                        ctx.font = '800 85px Montserrat';
                        
                        const textMetrics = ctx.measureText(texts.t3);
                        const line3X = startX + 80;
                        const yOffset = (1 - easeVal) * 30;

                        ctx.textBaseline = 'top';
                        ctx.fillText(texts.t3, line3X, baseY3 + yOffset);

                    const easeVal = cfg.animateSource ? easeOutQuart(Math.min(1, tSource)) : 1;
                    ctx.globalAlpha = easeVal * 0.75;

                    ctx.textBaseline = 'bottom';

                    if (cfg.sourceAlign === 'right') {

                    const xOffset = (1 - easeVal) * (cfg.sourceAlign === 'right' ? 20 : -20);

                    canvas.width = 1920;

                    const stream = canvas.captureStream(60);

                    mediaRecorderRef.current.ondataavailable = e => {

                                                <input type="file" accept="image/*" onChange={handleCharacterUpload} className="w-full text-xs text-slate-400 file:mr-3 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-blue-600 file:text-white hover:file:bg-blue-500 cursor-pointer" />
                                                
                                                {/* Positioning Sliders (Offset X and Offset Y for Character) */}
                                                <div className="bg-[#0a0b0e] p-3 rounded-lg border border-white/10 space-y-2">
                                                    <span className="text-[10px] font-bold text-blue-400 uppercase tracking-wider">Ajuste Fino de Posición (Foto Interna)</span>
                                                    <div className="space-y-1">
                                                        <div className="flex justify-between text-[10px] text-slate-400">
                                                            <span>Posición Horizontal (X): {charOffsetX}px</span>
                                                            <button onClick={() => setCharOffsetX(0)} className="text-blue-400 hover:underline">Reset</button>
                                                        </div>
                                                        <input type="range" min="-400" max="400" value={charOffsetX} onChange={e => setCharOffsetX(parseInt(e.target.value))}
                                                            className="w-full accent-blue-500 cursor-pointer" />
                                                    </div>
                                                    <div className="space-y-1">
                                                        <div className="flex justify-between text-[10px] text-slate-400">
                                                            <span>Posición Vertical (Y): {charOffsetY}px</span>
                                                            <button onClick={() => setCharOffsetY(0)} className="text-blue-400 hover:underline">Reset</button>
                                                        </div>
                                                        <input type="range" min="-400" max="400" value={charOffsetY} onChange={e => setCharOffsetY(parseInt(e.target.value))}
                                                            className="w-full accent-blue-500 cursor-pointer" />
                                                    </div>
                                                </div>

                                                <input type="text" placeholder="Nombre del personaje" value={charName} onChange={e => setCharName(e.target.value)}
                                                    className="w-full bg-[#0a0b0e] border border-white/10 rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-blue-500" />
                                                <input type="text" placeholder="Cargo o Puesto" value={charRole} onChange={e => setCharRole(e.target.value)}
                                                    className="w-full bg-[#0a0b0e] border border-white/10 rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-blue-500" />
                                                
                                                <div className="pt-2 border-t border-white/10 space-y-1">
                                                    <label className="text-[10px] font-semibold text-amber-400 uppercase">Logotipo de Partido / Organización (.PNG)</label>
                                                    <input type="file" accept="image/*" onChange={handlePartyLogoUpload} className="w-full text-xs text-slate-400 file:mr-3 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-amber-600 file:text-white hover:file:bg-amber-500 cursor-pointer" />
                                                </div>
                                            </div>
                                        )}
                                    </div>
                                </div>

                                <div className="pt-4 border-t border-white/10 grid grid-cols-2 gap-3">
                                    <div className="space-y-1">
                                        <label className="text-[10px] font-semibold text-slate-400 uppercase">Movimiento</label>
                                        <select value={motionStyle} onChange={e => setMotionStyle(e.target.value)}
                                            className="w-full bg-[#13151c] border border-white/10 rounded-xl px-2.5 py-2 text-xs text-white focus:outline-none focus:border-blue-500">
                                            <option value="classic">Clásico</option>
                                            <option value="dynamic">Dinámico</option>
                                            <option value="spring">Spring</option>
                                        </select>
                                    </div>
                                    <div className="space-y-1">
                                        <label className="text-[10px] font-semibold text-slate-400 uppercase">Orden Textos</label>
                                        <select value={textOrder} onChange={e => setTextOrder(e.target.value)}
                                            className="w-full bg-[#13151c] border border-white/10 rounded-xl px-2.5 py-2 text-xs text-white focus:outline-none focus:border-blue-500">
                                            <option value="standard">Estándar</option>
                                            <option value="subtitleTop">Subtítulo Arriba</option>
                                            <option value="blockBottom">Bloque Abajo</option>
                                        </select>
                                    </div>
                                    <div className="space-y-1">
                                        <label className="text-[10px] font-semibold text-slate-400 uppercase">Fondo</label>
                                        <select value={bgColorChoice} onChange={e => setBgColorChoice(e.target.value)}
                                            className="w-full bg-[#13151c] border border-white/10 rounded-xl px-2.5 py-2 text-xs text-white focus:outline-none focus:border-blue-500">
                                            <option value="white">Blanco</option>
                                            <option value="grey">Gris</option>
                                            <option value="black">Negro</option>
                                            <option value="navy">Marino (#191929)</option>
                                            <option value="light_navy">Claro Marino (#F0F0F5)</option>
                                            <option value="deep_navy">Marino Profundo (#000033)</option>
                                            <option value="light_slate">Pizarra Claro (#EAEAF5)</option>
                                            <option value="ivory">Marfil (#FAFAF7)</option>
                                            <option value="crimson">Carmesí (#A32929)</option>
                                            <option value="melocoton">Melocotón (#F9E1DC)</option>
                                            <option value="caoba">Caoba (#692113)</option>
                                            <option value="rojo_claro">Rojo Claro (#FFD6D6)</option>
                                            <option value="rojo_oscuro">Rojo Oscuro (#3D0000)</option>
                                            <option value="oliva">Oliva (#869108)</option>
                                            <option value="rosa_coral">Rosa Coral (#EF6C77)</option>
                                            <option value="durazno">Durazno (#EFA36C)</option>
                                            <option value="verde_bosque">Verde Bosque (#419108)</option>
                                            <option value="amarillo_claro">Amarillo Claro (#FFE34C)</option>
                                            <option value="amarillo_oscuro">Amarillo Oscuro (#CCAC00)</option>
                                        </select>
                                    </div>
                                    <div className="space-y-1">
                                        <label className="text-[10px] font-semibold text-slate-400 uppercase">Paleta</label>
                                        <select value={paletteChoice} onChange={e => setPaletteChoice(e.target.value)}
                                            className="w-full bg-[#13151c] border border-white/10 rounded-xl px-2.5 py-2 text-xs text-white focus:outline-none focus:border-blue-500">
                                            <option value="minimal">Monocromo</option>
                                            <option value="vibrant">Azul Pro</option>
                                            <option value="neon">Neón Cyan</option>
                                            <option value="navy_palette">Marino & Oro</option>
                                            <option value="navy_lime">Marino & Lima</option>
                                            <option value="rosa_navy">Rosa & Carmesí</option>
                                            <option value="terracota">Terracota</option>
                                            <option value="rojo_intenso">Rojo Intenso</option>
                                            <option value="otono">Otoño</option>
                                            <option value="citrico">Cítrico</option>
                                            <option value="amarillo_oro">Amarillo & Oro</option>
                                        </select>
                                    </div>
                                    <div className="space-y-1 col-span-2">
                                        <label className="text-[10px] font-semibold text-slate-400 uppercase">Textura (Patrón)</label>
                                        <select value={bgType} onChange={e => setBgType(e.target.value)}
                                            className="w-full bg-[#13151c] border border-white/10 rounded-xl px-2.5 py-2 text-xs text-white focus:outline-none focus:border-blue-500">
                                            <option value="gradient">Ninguno (Degradado Limpio)</option>
                                            <option value="pattern_dots">Puntos Clásicos</option>
                                            <option value="pattern_grid">Cuadrícula Tech</option>
                                            <option value="pattern_stripes">Líneas Diagonales</option>
                                            <option value="pattern_cross">Cruces Minimalistas</option>
                                            <option value="pattern_hex">Panal Hexagonal</option>
                                            <option value="pattern_waves">Ondas Topográficas</option>
                                            <option value="pattern_circuit">Circuitos / Nodos</option>
                                        </select>
                                    </div>
                                </div>
                            </div>

                            <div className="mt-8 space-y-3 pt-4 border-t border-white/10 shrink-0">
                                <button onClick={exportImage}
                                    className="w-full py-3 rounded-xl font-semibold text-sm transition-all flex justify-center items-center gap-2 bg-emerald-600 hover:bg-emerald-500 text-white shadow-lg shadow-emerald-600/20">
                                    Descargar Imagen PNG (1920x1080)
                                </button>
                                <button onClick={() => playAnimation(false)} disabled={isPlaying}
                                    className={`w-full py-3 rounded-xl font-semibold text-sm transition-all flex justify-center items-center gap-2 border ${isPlaying ? 'bg-white/5 border-white/5 text-slate-500 cursor-not-allowed' : 'bg-white/10 hover:bg-white/15 border-white/15 text-white shadow-lg'}`}>
                                    Previsualizar Animación
                                </button>
                                <button onClick={() => playAnimation(true)} disabled={isRecording || isPlaying}
                                    className={`w-full py-3.5 rounded-xl font-bold text-sm transition-all flex justify-center items-center gap-2 shadow-xl ${isRecording || isPlaying ? 'bg-blue-600/50 text-slate-300 cursor-not-allowed' : 'bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white shadow-blue-500/25'}`}>
                                    <div className={`w-3 h-3 rounded-full bg-white ${isRecording ? 'animate-ping' : 'animate-pulse'}`}></div>
                                    {isRecording ? 'Renderizando Video...' : 'Exportar a WebM (.webm)'}
                                </button>
                            </div>
                        </div>

                        <div className="flex-1 p-6 lg:p-12 flex flex-col items-center justify-center bg-[#050608] relative overflow-hidden">
                            <div className="absolute w-[600px] h-[600px] bg-blue-600/10 rounded-full blur-[140px] pointer-events-none"></div>

                            <div className="w-full max-w-5xl relative z-10 flex flex-col items-center">
                                <div className="canvas-container">
                                    <canvas ref={canvasRef} width="1920" height="1080"></canvas>
                                    
                                    {isRecording && (
                                        <div className="recording-overlay flex-col gap-4">
                                            <div className="text-white font-bold text-xl flex items-center gap-3">
                                                <div className="w-4 h-4 bg-blue-500 rounded-full animate-ping"></div>
                                                Renderizando Frame a Frame (60 FPS)
                                            </div>
                                            <div className="w-72 bg-white/10 h-2 rounded-full overflow-hidden p-0.5 border border-white/10">
                                                <div className="h-full bg-gradient-to-r from-blue-500 to-cyan-400 rounded-full transition-all duration-75" style={{ width: `${progress}%` }}></div>
                                            </div>
                                            <span className="text-xs font-mono text-blue-400 font-bold">{Math.round(progress)}% Completo</span>
                                        </div>
                                    )}
                                </div>
                                <div className="mt-4 flex items-center justify-between w-full text-xs text-slate-400 px-2 font-medium">
                                    <div className="flex items-center gap-2">
                                        <span className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                                        <span>Motor Canvas HD Activo</span>
                                    </div>
                                    <div className="bg-white/5 border border-white/10 px-3 py-1 rounded-full text-slate-300">
                                        Resolución: 1920x1080 • Formato WebM VP9 & PNG
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
